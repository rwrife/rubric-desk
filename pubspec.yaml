name: rubric_desk
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  fluent_ui: ^4.17.0
  flutter:
    sdk: flutter
  sqlite3: ^3.1.1
  sqlite3_flutter_libs: ^0.6.0+eol
  path_provider: ^2.1.5
  uuid: ^4.5.1
  share_plus: ^12.0.1
  file_picker: ^10.3.8
  # ponytail: system share/open pickers only; no network service.
  # ponytail: provider plugins compile on platform CI before release.
  # ponytail: one private SQLite file; no sync layer.


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
